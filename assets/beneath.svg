      <text x="101" y="57" font-size="17" font-weight="600" letter-spacing="2.5" fill="#C4D8DC">HAICHUAN</text>
      <text x="54" y="145" font-size="62" font-weight="700" letter-spacing="-2" fill="#F1F6F7">What lies beneath?</text>
      <text x="57" y="201" font-size="24" font-weight="400" letter-spacing=".1" fill="#A8D7D1">Between observation and understanding.</text>
      <path d="M57 243H652" stroke="#36515A" />
      <text x="57" y="286" font-size="15" letter-spacing="1.5" fill="#AEC2CB">MATTER</text>
      <circle cx="149" cy="281" r="2" fill="#7DE3CE" />
      <text x="175" y="286" font-size="15" letter-spacing="1.5" fill="#AEC2CB">CHANGE</text>
      <circle cx="274" cy="281" r="2" fill="#7DE3CE" />
      <text x="300" y="286" font-size="15" letter-spacing="1.5" fill="#AEC2CB">UNDERSTANDING</text>
      <g stroke-linejoin="round" stroke-linecap="round">
