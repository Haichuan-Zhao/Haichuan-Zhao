        <path d="M825 262L961 208L1097 262L961 316Z" fill="#183C45" fill-opacity=".7" stroke="#4D7D88" stroke-width="1.3" />
        <path d="M870 244L1006 298M916 226L1052 280M870 280L1006 226M916 298L1052 244" stroke="#47737D" stroke-opacity=".7" />
        <path d="M825 188L961 134L1097 188L961 242Z" fill="#1C4148" fill-opacity=".85" stroke="url(#depth)" stroke-width="1.5" />
        <path d="M871 188L961 152L1051 188L961 224Z M916 170L1006 206M1006 170L916 206" stroke="#5F9EAA" stroke-opacity=".75" />
        <g fill="#8FDCCF">
          <circle cx="871" cy="188" r="3" /><circle cx="916" cy="170" r="3" />
          <circle cx="961" cy="152" r="3" /><circle cx="1006" cy="170" r="3" />
          <circle cx="1051" cy="188" r="3" /><circle cx="1006" cy="206" r="3" />
