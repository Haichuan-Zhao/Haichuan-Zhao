<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Haichuan — What lies beneath?</title>
  <desc id="desc">Three translucent planes reveal the structures beneath an observed surface, reflecting the space between observation and understanding.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38515D" fill-opacity=".45" />
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F2B" />
      <stop offset="1" stop-color="#142E36" />
    </linearGradient>
    <linearGradient id="depth" x1="825" y1="60" x2="1097" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DE3CE" />
      <stop offset="1" stop-color="#488C98" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#field)" />
    <rect x="692" y="0" width="508" height="360" fill="url(#grid)" />
    <path d="M0 0H1200" stroke="#7DE3CE" stroke-width="5" />
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
